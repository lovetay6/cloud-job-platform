server:
  port: ${PORT:8080}
  shutdown: graceful

spring:
  application:
    name: cloud-job-platform
  threads:
    virtual:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 25s
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cloudjob}
    username: ${DB_USERNAME:cloudjob}
    password: ${DB_PASSWORD:cloudjob}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 10000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized

logging:
  structured:
    format:
      console: logstash

app:
  aws:
    clients-enabled: true
    region: ${AWS_REGION:ap-southeast-2}
    s3-bucket: ${S3_BUCKET:}
    sqs-queue-url: ${SQS_QUEUE_URL:}
    sqs-dlq-url: ${SQS_DLQ_URL:}
    presigned-url-expiry-seconds: ${PRESIGNED_URL_EXPIRY_SECONDS:300}
    worker:
      enabled: ${WORKER_ENABLED:false}
      wait-time-seconds: 20
      max-messages: 5
      lease-seconds: 60
      max-concurrency: 4
