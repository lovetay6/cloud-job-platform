name: CI/CD - Java on AWS ECS Fargate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: ap-southeast-2
  ECR_REPOSITORY: cloud-job-platform
  ECS_CLUSTER: cloud-job-platform-dev-cluster
  ECS_API_SERVICE: cloud-job-platform-dev-api
  ECS_WORKER_SERVICE: cloud-job-platform-dev-worker
  ECS_API_TASK_FAMILY: cloud-job-platform-dev-api
  ECS_WORKER_TASK_FAMILY: cloud-job-platform-dev-worker

jobs:
  ci:
    name: Build, Unit Tests & Terraform Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run Maven unit & CAS repository tests
        working-directory: app
        run: mvn -B test

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.17.2

      - name: Terraform format & validate
        run: |
          terraform fmt -check -recursive infra
          for dir in infra/bootstrap infra/env/dev; do
            echo "Validating $dir"
            (cd "$dir" && terraform init -backend=false -input=false && terraform validate)
          done

  build-and-deploy:
    name: Build ARM64 Image, Push to ECR & Deploy ECS
    needs: ci
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Least-privilege CI IAM key scoped only to this ECR repo + project ECS services.
      # On a Paid/Org AWS account, swap to OIDC by setting:
      #   role-to-assume: arn:aws:iam::<account-id>:role/github-actions-deploy
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push ARM64 (Graviton) image to ECR
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check if dev ECS services are provisioned
        id: check-ecs
        run: |
          STATUS=$(aws ecs describe-services \
            --cluster "${{ env.ECS_CLUSTER }}" \
            --services "${{ env.ECS_API_SERVICE }}" \
            --query "services[0].status" \
            --output text 2>/dev/null || echo "NONE")
          echo "service_status=$STATUS" >> "$GITHUB_OUTPUT"
          echo "Detected ECS API service status: $STATUS"

      - name: Render & rolling-deploy API ECS service
        if: steps.check-ecs.outputs.service_status == 'ACTIVE'
        run: |
          IMAGE="${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}"
          aws ecs describe-task-definition --task-definition "${{ env.ECS_API_TASK_FAMILY }}" \
            --query 'taskDefinition | {family:family,executionRoleArn:executionRoleArn,taskRoleArn:taskRoleArn,networkMode:networkMode,containerDefinitions:containerDefinitions,requiresCompatibilities:requiresCompatibilities,cpu:cpu,memory:memory,runtimePlatform:runtimePlatform}' \
            | jq --arg IMG "$IMAGE" '.containerDefinitions[0].image = $IMG' > api-taskdef.json
          NEW_ARN=$(aws ecs register-task-definition --cli-input-json file://api-taskdef.json --query 'taskDefinition.taskDefinitionArn' --output text)
          aws ecs update-service --cluster "${{ env.ECS_CLUSTER }}" --service "${{ env.ECS_API_SERVICE }}" --task-definition "$NEW_ARN" --no-cli-pager

      - name: Render & rolling-deploy Worker ECS service
        if: steps.check-ecs.outputs.service_status == 'ACTIVE'
        run: |
          IMAGE="${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}"
          aws ecs describe-task-definition --task-definition "${{ env.ECS_WORKER_TASK_FAMILY }}" \
            --query 'taskDefinition | {family:family,executionRoleArn:executionRoleArn,taskRoleArn:taskRoleArn,networkMode:networkMode,containerDefinitions:containerDefinitions,requiresCompatibilities:requiresCompatibilities,cpu:cpu,memory:memory,runtimePlatform:runtimePlatform}' \
            | jq --arg IMG "$IMAGE" '.containerDefinitions[0].image = $IMG' > worker-taskdef.json
          NEW_ARN=$(aws ecs register-task-definition --cli-input-json file://worker-taskdef.json --query 'taskDefinition.taskDefinitionArn' --output text)
          aws ecs update-service --cluster "${{ env.ECS_CLUSTER }}" --service "${{ env.ECS_WORKER_SERVICE }}" --task-definition "$NEW_ARN" --no-cli-pager

      - name: Wait for ECS services stability
        if: steps.check-ecs.outputs.service_status == 'ACTIVE'
        run: |
          aws ecs wait services-stable \
            --cluster "${{ env.ECS_CLUSTER }}" \
            --services "${{ env.ECS_API_SERVICE }}" "${{ env.ECS_WORKER_SERVICE }}"
